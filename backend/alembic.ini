# Alembic (schema migrations). Run from the backend folder:
#   DATABASE_URL=postgresql+psycopg://user:pass@host:5432/db  .venv\Scripts\python.exe -m alembic upgrade head
# The database URL is NOT stored here: migrations/env.py reads DATABASE_URL (alias APP_DB_URL) and refuses
# to run without it or with a database other than PostgreSQL.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
