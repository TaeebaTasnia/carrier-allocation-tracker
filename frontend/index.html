<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrier Allocation &amp; Utilization Tracker</title>
<!-- before the first paint: the landing and sign-in stay dark (video); only the colour the dive fades to
     follows the theme, so the dashboard's ground is already there when it loads -->
<script src="js/boot.js"></script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* palette taken from the footage: cream ink, dusk navy, steel sky */
    --ink: #f7f4ee;
    --ink-dim: rgba(247, 244, 238, .68);
    --navy: #0b141f;
    --steel: #8fb0cf;
    --hull: #d4553a;
    --ease: cubic-bezier(.22, .9, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #05080c; }
  body { overflow: hidden; font-family: "Inter", system-ui, sans-serif; color: var(--ink); }
  ::selection { background: rgba(247,244,238,.28); }

  /* ---------- landing ---------- */
  /* the camera rig: perspective lives here so the dive can pitch down like a drone */
  .cam { position: fixed; inset: 0; overflow: hidden; background: #05080c; perspective: 1200px; perspective-origin: 50% 50%; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 0 0; will-change: transform; }
  .grade {
    position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(3,6,10,.62) 0%, rgba(3,6,10,.34) 34%, rgba(3,6,10,0) 62%);
    transition: opacity .8s var(--ease);
  }
  /* the only extra layer: the fade to the next page's dark ground */
  .black { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 5; background: #05080c; will-change: opacity; transform: translateZ(0); }
  /* light theme: fade to the paper the dashboard opens on (= --night of the light theme in css/tokens.css) */
  html[data-theme="light"] .black { background: #efe9de; }
  body.cinema .grade, body.cinema .stage { opacity: 0; }
  body.cinema .hotspot { pointer-events: none; }
  /* the glass (backdrop blur over a playing video is the expensive part) goes away almost instantly, before the camera moves */
  body.cinema .overlay { opacity: 0; visibility: hidden; transition: opacity .14s linear, visibility 0s linear .14s; }
  body.cinema .card { transform: translateY(-14px) scale(1.02); opacity: 0; transition: transform .14s linear, opacity .12s linear; }
  .stage { position: relative; z-index: 1; height: 100%; display: flex; align-items: center; padding: 0 clamp(24px, 6vw, 112px); }
  h1.title {
    max-width: 11ch;
    font-family: "Cormorant Garamond", "Cormorant", Georgia, serif;
    font-weight: 500; font-size: clamp(2.75rem, 7.2vw, 7rem);
    line-height: 1.02; letter-spacing: -0.01em; color: var(--ink);
    text-shadow: 0 2px 32px rgba(0,0,0,.35);
  }
  /* invisible hit area in the bottom-right corner: opens the sign-in card */
  .hotspot {
    position: fixed; right: 0; bottom: 0; z-index: 2;
    width: clamp(110px, 16vw, 220px); height: clamp(110px, 16vw, 220px);
    background: transparent; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .hotspot { font-family: inherit; }
  body.login-open .hotspot span, body.cinema .hotspot span { opacity: 0; }
  .hotspot span {
    position: absolute; right: clamp(20px, 3vw, 44px); bottom: clamp(20px, 3.4vh, 40px);
    font-size: .95rem; font-weight: 500; letter-spacing: .01em; color: rgba(247,244,238,.86);
    text-shadow: 0 1px 14px rgba(0,0,0,.55);
    padding-bottom: 3px; border-bottom: 1px solid rgba(247,244,238,.4);
    transition: color .25s, border-color .25s, opacity .45s var(--ease);
  }
  .hotspot:hover span, .hotspot:focus-visible span { color: #fff; border-color: rgba(255,255,255,.9); }
  .hotspot:focus-visible { outline: 2px solid rgba(247,244,238,.7); outline-offset: -10px; border-radius: 24px; }

  /* ---------- sign-in overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
    background: rgba(3, 7, 12, .38);
    opacity: 0; visibility: hidden;
    transition: opacity .45s var(--ease), visibility 0s linear .45s;
  }
  .overlay.open { opacity: 1; visibility: visible; transition: opacity .45s var(--ease); }
  .overlay { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  /* the landing title steps back while the card is up */
  .stage { transition: opacity .45s var(--ease); }
  body.login-open .stage { opacity: 0; }

  .card {
    position: relative; width: min(440px, 100%);
    padding: 36px 32px 30px; border-radius: 30px; isolation: isolate;
    /* dark tint first so cream text always reads, then the glass highlights */
    background:
      radial-gradient(120% 70% at var(--mx, 30%) var(--my, 0%), rgba(255,255,255,.16), rgba(255,255,255,0) 55%),
      linear-gradient(165deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 42%, rgba(143,176,207,.08)),
      rgba(11, 20, 31, .56);
    -webkit-backdrop-filter: blur(30px) saturate(1.6);
            backdrop-filter: blur(30px) saturate(1.6);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.38),
      inset 0 -1px 0 rgba(255,255,255,.06),
      inset 0 0 40px rgba(255,255,255,.045),
      0 40px 90px rgba(0,0,0,.5),
      0 4px 14px rgba(0,0,0,.28);
    transform: translateY(18px) scale(.965); opacity: 0;
    transition: transform .6s var(--ease), opacity .45s var(--ease);
  }
  .overlay.open .card { transform: none; opacity: 1; }
  /* specular rim: a bright edge that fades around the glass */
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: -1;
    background: linear-gradient(140deg, rgba(255,255,255,.7), rgba(255,255,255,.08) 28%, rgba(255,255,255,0) 60%, rgba(143,176,207,.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }

  .logo { display: block; width: 168px; height: auto; margin: 0 auto; }
  .rule { width: 56px; height: 1px; margin: 18px auto 20px; background: rgba(247,244,238,.34); }
  h2 { text-align: center; font-size: 1.7rem; font-weight: 600; letter-spacing: -.015em; }
  .sub { text-align: center; margin-top: 8px; font-size: .95rem; color: var(--ink-dim); line-height: 1.4; }

  .btn {
    display: block; width: 100%; height: 54px; margin-top: 28px; border: 0; border-radius: 16px; cursor: pointer;
    font: inherit; font-size: 1.02rem; font-weight: 600; color: var(--navy);
    background: linear-gradient(180deg, #fbf9f4, #d9e3ee);
    box-shadow: inset 0 1px 0 #fff, inset 0 -2px 6px rgba(11,20,31,.12), 0 10px 28px rgba(0,0,0,.32);
    transition: transform .2s var(--ease), box-shadow .25s, filter .25s;
  }
  .btn:hover { filter: brightness(1.04); box-shadow: inset 0 1px 0 #fff, inset 0 -2px 6px rgba(11,20,31,.12), 0 14px 34px rgba(0,0,0,.38); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px) scale(.992); }
  .btn[disabled] { cursor: default; filter: none; transform: none; }
  .btn:focus-visible { outline: 2px solid rgba(247,244,238,.85); outline-offset: 2px; }

  .note { min-height: 20px; margin-top: 14px; text-align: center; font-size: .88rem; color: var(--ink-dim); }
  .note.err { color: #ffb4a3; }

  @media (max-width: 640px) {
    .grade { background: linear-gradient(0deg, rgba(3,6,10,.66) 0%, rgba(3,6,10,.2) 55%, rgba(3,6,10,0) 80%); }
    .stage { align-items: flex-end; padding-bottom: 12vh; }
    h1.title { max-width: 12ch; }
    .card { padding: 30px 22px 24px; border-radius: 26px; }
  }
  /* no blur support: keep the card readable */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .card { background: rgba(11, 20, 31, .9); }
  }
  @media (prefers-reduced-motion: reduce) {
    .overlay, .card, .btn { transition-duration: .01s !important; }
  }
</style>
</head>
<body>
  <div class="cam"><video class="bg" src="assets/landing.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video></div>
  <div class="grade"></div>
  <main class="stage">
    <h1 class="title">Carrier Allocation &amp; Utilization Tracker</h1>
  </main>
  <button class="hotspot" id="open-login" type="button" aria-haspopup="dialog"><span>Click here to login</span></button>

  <div class="overlay" id="overlay" aria-hidden="true">
    <section class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="login-title" aria-describedby="note">
      <img class="logo" src="assets/mgh-logo-white.png" alt="MGH" width="844" height="317">
      <div class="rule"></div>
      <h2 id="login-title">Sign in</h2>
      <p class="sub">Carrier Allocation &amp; Utilization Tracker</p>
      <button class="btn" id="signin" type="button">Sign in</button>
      <p class="note" id="note" role="status" aria-live="polite"></p>
    </section>
  </div>

  <div class="black" id="black"></div>

  <script src="js/data.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
